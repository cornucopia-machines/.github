# Puts what bots open across the org on the "Next Up" project: Dependabot's pull requests in In review, and
# the issues our workflows open in Backlog. See README.md, "Next Up board".
#
# One scheduled run here instead of a step in every repo: a project token in each repo would be needed otherwise,
# and workflows Dependabot triggers only get Dependabot's own secrets. This repo is public, so its minutes are free.
name: Board bot items

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: board-bot-items

jobs:
  add:
    name: Add bot items to the board
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The GITHUB_TOKEN can't write to the org's projects. The "Claude GitHub Projects MCP" GitHub App can: it has
      # Projects read and write on the org, and read access to issues and pull requests.
      - name: Get a token for the project
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          # Every repo the app is installed on: bots open items in any of them, and only reading them is allowed
          owner: ${{ github.repository_owner }} # zizmor: ignore[github-app]
          # Only what the script needs, though the app has no more than this anyway
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Add missing items
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ORG: ${{ github.repository_owner }}
        run: scripts/board-add-bot-items.sh
