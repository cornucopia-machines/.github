# Reusable secret scan: TruffleHog over the commits a push or pull request adds.
#
# Call it from each repo with a small workflow (see README.md). The action works out the range to
# scan from the triggering event (the PR's commits, or the commits a push added), so callers should
# run it on `push` to the default branch and on `pull_request`.
#
# Only verified (confirmed live) and unknown (couldn't be checked) findings fail the job. Verifying
# sends each candidate secret to the service that issued it, and nowhere else.
name: Secret scan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # TruffleHog scans a commit range, so it needs the history, not just the tip.
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          extra_args: --results=verified,unknown
