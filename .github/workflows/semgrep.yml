# Reusable static analysis (SAST) with Semgrep Community Edition, which is free on private repos
# (CodeQL needs GitHub Advanced Security there).
#
# On a pull request it only reports findings the PR adds (`--baseline-commit`), and fails on them,
# so code that was there before doesn't block every PR. Any other event (e.g. workflow_dispatch)
# scans everything and only lists the findings, for a look at what's already there.
#
# Call it from each repo with a small workflow (see README.md), on pull requests. Semgrep skips what
# the repo's `.semgrepignore` lists (by default: tests, node_modules, build output and the like). To
# skip one finding that doesn't apply, add a `// nosemgrep: <rule-id>` comment saying why.
name: Semgrep

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated paths to scan, relative to the repo root.
        type: string
        default: .
      config:
        description: >-
          Semgrep rules to use: a registry ruleset (`p/...`) or a file in the repo. Space-separated
          for more than one.
        type: string
        default: p/default

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: 1.184.0
    steps:
      - uses: actions/checkout@v7
        with:
          # The baseline commit (the PR's base) has to be in the history.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        env:
          PATHS: ${{ inputs.paths }}
          CONFIG: ${{ inputs.config }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          read -ra paths <<< "$PATHS"
          configs=()
          for config in $CONFIG; do
            configs+=(--config "$config")
          done
          # Metrics off: nothing about the code is sent to Semgrep, only the rule download is.
          args=(scan --metrics=off "${configs[@]}")
          if [ -n "$BASE_SHA" ]; then
            args+=(--error --baseline-commit "$BASE_SHA")
          fi
          pipx run "semgrep==$SEMGREP_VERSION" "${args[@]}" "${paths[@]}"
