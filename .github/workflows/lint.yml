# Lints what this repo shares, since a mistake here breaks every repo that uses it.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The same lint every repo calls, from this commit, so a change to it is tested before callers pick
  # it up from main.
  actions:
    uses: $/.github/workflows/actions-lint.yml

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check shell scripts
        run: shellcheck actions/*/*.sh
