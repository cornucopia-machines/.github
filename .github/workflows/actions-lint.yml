# Reusable lint for a repo's GitHub Actions workflows and actions:
#
# - actionlint for mistakes in workflows: syntax, expression types, unknown inputs, and shellcheck on
#   `run:` scripts. It reads the caller's `.github/actionlint.yaml` if there is one.
# - check-jsonschema for `action.yml` files, which actionlint doesn't read.
# - zizmor for security problems: template injection, over-broad permissions, credentials left in
#   checkouts, risky triggers, and actions not pinned the way the org pins them.
#
# zizmor uses this repo's `zizmor.yml`, so every repo follows the same pinning policy (README.md,
# "Pinning actions"). A caller's own `zizmor.yml` (or `.github/zizmor.yml`) is merged on top of it.
# Suppress a single finding where it is with a `# zizmor: ignore[<audit>]` comment saying why.
#
# Call it from each repo with a small workflow (see README.md), on pull requests that touch
# `.github/`.
name: Actions lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Actions lint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      CHECK_JSONSCHEMA_VERSION: 0.39.0
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned by checksum, like the scanners the actions install.
      - name: Install actionlint
        run: |
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          rm actionlint.tar.gz

      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

      # actionlint only reads workflows; action.yml files get checked against their JSON schema
      # (from SchemaStore, bundled with check-jsonschema), which catches invalid YAML and unknown or
      # misplaced keys.
      - name: Validate actions
        run: |
          mapfile -t actions < <(git ls-files ':(glob)**/action.yml' ':(glob)**/action.yaml')
          if [ "${#actions[@]}" -eq 0 ]; then
            echo "No actions to validate."
            exit 0
          fi
          pipx run "check-jsonschema==$CHECK_JSONSCHEMA_VERSION" --builtin-schema vendor.github-actions "${actions[@]}"

      # The org's config is taken from main, like the shared actions (`@main`), except in this repo,
      # where a PR's own version is the one to test. A repo's own config is merged on top of it
      # rather than replacing it, so a repo that only adds an ignore keeps the org's pinning policy:
      # maps merge (the repo's value wins where both set a key) and lists, such as `ignore`, add up.
      # yq is mikefarah's yq 4, preinstalled on GitHub's Ubuntu runners.
      - name: Get the zizmor config
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          config="$RUNNER_TEMP/zizmor.yml"
          if [ "$REPOSITORY" = cornucopia-machines/.github ]; then
            cp zizmor.yml "$config"
          else
            curl -fsSL --retry 3 -o "$config" \
              https://raw.githubusercontent.com/cornucopia-machines/.github/main/zizmor.yml
            for own in zizmor.yml .github/zizmor.yml; do
              if [ -f "$own" ]; then
                echo "Merging $own on top of the org's config."
                # shellcheck disable=SC2016 # $item is yq's variable, not the shell's.
                yq eval-all --inplace '. as $item ireduce ({}; . *+ $item)' "$config" "$own"
              fi
            done
          fi
          # An explicit --config also stops zizmor from finding the repo's own file by itself.
          echo "ZIZMOR_CONFIG=$config" >> "$GITHUB_ENV"
          echo "::group::zizmor config"
          cat "$config"
          echo "::endgroup::"

      - name: Audit with zizmor
        env:
          # For the online audits, e.g. actions with known vulnerabilities.
          GH_TOKEN: ${{ github.token }}
        run: pipx run "zizmor==$ZIZMOR_VERSION" --format github .
