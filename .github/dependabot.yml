# Keeps the actions the shared workflows and actions pin up to date; every calling repo picks the
# update up from here.
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    # Monthly, grouped: GitHub's actions follow their major tags, so they only come up for a new major, and the few
    # third-party ones (pinned to a commit) arrive together. Security updates come right away regardless.
    schedule:
      interval: monthly
    # A week: every repo in the org runs these actions, so let a compromised release get noticed
    # and pulled before it's picked up.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'

  # The Claude queue trigger Worker's Wrangler, which deploys it
  - package-ecosystem: npm
    directory: /claude-queue-trigger
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - '*'
