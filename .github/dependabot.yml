# Keeps the actions the shared workflows and actions pin up to date; every calling repo picks the
# update up from here.
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    schedule:
      interval: weekly
      day: monday
    # A week: every repo in the org runs these actions, so let a compromised release get noticed
    # and pulled before it's picked up.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
