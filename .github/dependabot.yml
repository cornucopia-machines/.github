# Keeps the actions the shared workflows and actions pin up to date; every calling repo picks the
# update up from here.
version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - '*'
