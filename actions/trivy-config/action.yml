name: Trivy misconfiguration check
description: >
  Checks Dockerfiles, compose files, Kubernetes manifests, Terraform and the like for security
  misconfigurations (running as root, privileged containers, secrets in ENV, ...) with Trivy, and
  fails on any. Vulnerabilities are the grype-scan action's job.

inputs:
  paths:
    description: Files or directories to check, one per line.
    required: true
  severity:
    description: Severities to fail on, comma-separated.
    default: HIGH,CRITICAL
  ignorefile:
    description: >
      Trivy ignore file, relative to the workspace, used if it exists: one check ID per line (e.g.
      `DS-0002`), with a comment saying why.
    default: .trivyignore

runs:
  using: composite
  steps:
    # $GITHUB_ACTION_PATH, not ${{ github.action_path }}: in a job that runs in a container, the
    # latter is the runner's path, which doesn't exist inside the container.
    - name: Install Trivy
      shell: bash
      run: '"$GITHUB_ACTION_PATH/install.sh"'

    - name: Check for misconfigurations
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        SEVERITY: ${{ inputs.severity }}
        IGNOREFILE: ${{ inputs.ignorefile }}
      run: '"$GITHUB_ACTION_PATH/check.sh"'
