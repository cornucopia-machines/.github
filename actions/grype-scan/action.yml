name: Grype vulnerability scan
description: >
  Scans SBOMs or container images for known vulnerabilities with Grype, lists the findings in the
  job summary, and fails (or warns) on the ones that have a fix.

inputs:
  targets:
    description: >
      What to scan, one per line, in Grype's syntax: `sbom:path/to/sbom.json` (CycloneDX or SPDX,
      e.g. Syft's or ESP-IDF's), `registry:ghcr.io/org/image:tag` (pulled from the registry without
      Docker; private registries need a `docker login` first), or `docker:image:tag` (the local
      Docker, e.g. right after building with load: true).
    required: true
  pkg-types:
    description: >
      Grype package types to report, comma-separated (e.g. `deb,binary`), or empty for all. Leave
      out what another check already covers, such as `npm` where Dependabot alerts on the lockfiles.
      `binary` covers runtimes found by their executables (Node, Python, Go, ...), which no
      package manager lists.
    default: ''
  severity:
    description: Severities to report, comma-separated.
    default: HIGH,CRITICAL
  fail-on:
    description: >
      `fixable` fails on findings that have a fixed version (unfixable ones are listed, not failed
      on: base images always carry some), `any` fails on every finding, `none` only warns about
      fixable ones. Use `none` where the fix isn't in your hands, e.g. an image on a distroless
      base, which has no package manager to install a distro fix with before the base is rebuilt.
    default: fixable
  platform:
    description: >
      Platform to scan for multi-platform images, e.g. `linux/arm64`; the runner's by default. Set it
      to the platform the image actually runs on, or a registry scan picks the runner's variant.
    default: ''
  config:
    description: >
      Grype config file, relative to the workspace, used if it exists. Its `ignore` rules skip
      findings that don't apply; give each a comment saying why.
    default: .grype.yaml

outputs:
  findings:
    description: >
      Path to a JSON array of the findings, one object per vulnerable package and target: id,
      severity, title, url, target, package, installed, type, fixed (empty when there's no fix).
      This is the format the sync-cve-issues action reads.
    value: ${{ steps.scan.outputs.findings }}

runs:
  using: composite
  steps:
    # $GITHUB_ACTION_PATH, not ${{ github.action_path }}: in a job that runs in a container, the
    # latter is the runner's path, which doesn't exist inside the container.
    - name: Install Grype
      id: install
      shell: bash
      run: '"$GITHUB_ACTION_PATH/install.sh"'

    # Keyed by the database Grype would download now (see install.sh), so a hit is current and Grype downloads
    # nothing. No fallback to an older one: restoring it takes about 20 seconds, and Grype would replace it anyway.
    - name: Restore the Grype database
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/grype-db
        key: grype-db-${{ steps.install.outputs.db }}

    - name: Scan
      id: scan
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        PKG_TYPES: ${{ inputs.pkg-types }}
        SEVERITY: ${{ inputs.severity }}
        FAIL_ON: ${{ inputs.fail-on }}
        CONFIG: ${{ inputs.config }}
        PLATFORM: ${{ inputs.platform }}
      run: '"$GITHUB_ACTION_PATH/scan.sh"'
