name: Version
description: >
  Works out the version of the checked-out commit, in the one format every product uses: the tag
  for a release (`1.2.3`), or the last tag, the commits since and the commit for anything else
  (`1.2.3-4-ga728583`, from `git describe --tags --always --dirty`). A repo with no tags gets the
  commit's short hash. Needs the full history: check out with `fetch-depth: 0`.

inputs:
  fail-on-dirty:
    description: >
      Fail if tracked files have changed since the checkout, rather than returning a version ending in
      `-dirty`: a build of modified sources shouldn't pass for the commit's.
    default: 'true'

outputs:
  version:
    description: The version, e.g. `1.2.3`, `1.2.3-4-ga728583`, or `1.2.3-4-ga728583-dirty` with `fail-on-dirty` off.
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    # $GITHUB_ACTION_PATH, not ${{ github.action_path }}: in a job that runs in a container, the
    # latter is the runner's path, which doesn't exist inside the container.
    - name: Work out the version
      id: version
      shell: bash
      env:
        FAIL_ON_DIRTY: ${{ inputs.fail-on-dirty }}
      run: '"$GITHUB_ACTION_PATH/version.sh"'
